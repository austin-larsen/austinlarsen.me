# Nightly rebuild
#
# The site is static: anything date-driven (an upcoming talk moving into the
# past-talks grid once its date passes) is only re-evaluated at build time.
# Without this, a talk stays in "upcoming" until the next content push.
#
# This job POSTs to a Cloudflare Pages deploy hook once a day so the site
# rebuilds itself. It is a no-op until the secret exists.
#
# One-time setup:
#   1. Cloudflare dashboard -> Workers & Pages -> austinlarsen.me
#      -> Settings -> Builds & deployments -> Deploy hooks -> Add deploy hook
#      (name: nightly, branch: master) -> copy the hook URL
#   2. gh secret set CLOUDFLARE_DEPLOY_HOOK --repo austin-larsen/austinlarsen.me
#      (paste the URL when prompted)

name: Nightly rebuild

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily (~02:17 ET)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not set; skipping (see setup notes in this file)."
            exit 0
          fi
          curl -sS -X POST "$HOOK" -o /dev/null -w "Deploy hook response: %{http_code}\n"
